<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Student Map | Campus Locate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="student.css">
</head>

<body data-root="../">
    <div id="app"></div>
    <script src="../js/common.js"></script>
    <script>setSession({ role: 'student', name: 'Guest Student' });
    
        renderPage('Map', 'Live campus map', `<div class="page">
            ${mapMarkup()}
            
            <div class="card map-note">
                <strong>Presence terminology</strong>
                <p><b>Present</b> means faculty are confirmed inside campus. <b>In Session</b> means a classroom sensor and schedule confirm they are teaching in the room.</p>
            </div>
            </div>`);

        renderMap();
    </script>
</body>

</html>
