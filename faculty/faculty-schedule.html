<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Faculty Schedule Editor | Campus Locate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/faculty-schedule.css">
</head>

<body data-root="../">
    <div id="app"></div>
    <script src="../js/common.js"></script>
    <script src="../js/schedule.js"></script>
    <script>if (requireRole(['faculty'])) {
            renderPage('Faculty Schedule',
                'Schedule editor',
                `<div class="page faculty-schedule-page">
                <div class="page-heading faculty-schedule-heading">
                    <div>
                        <p class="eyebrow">Faculty-owned schedule</p>
                        <h1>Add a schedule.</h1>
                        <p class="subheading">Use one entry for multiple teaching days. Confirmation sends it to Admin as pending.</p>
                    </div>
                        <a class="outline back-to-portal" href="faculty-portal.html">Back to portal</a>
                </div>
                    <div class="card">

                        <form id="schedule-form">

                            <div class="form-grid">
                                <div class="field">
                                    <label for="subject">Subject name</label>
                                    <input id="subject" name="subject" required placeholder="Computer Programming 1">
                                </div>
                                <div class="field">
                                    <label for="code">Course code</label>
                                    <input id="code" name="code" required placeholder="CP101">
                                </div>
                            </div>

                            <div class="schedule-meta-grid">
                                <div class="field">
                                    <label for="course">Course <small>(select one or more)</small></label>
                                    <select id="course" name="course" multiple size="1" required>
                                        <option value="" disabled selected hidden>Select Course</option>
                                        ${optionList(COURSES)}
                                    </select>
                                </div>
                                <div class="field">
                                    <label for="room">Room</label>
                                    <select id="room" name="room" required>
                                        <option value="">Select Room</option>
                                        ${optionList(ROOMS)}
                                    </select>
                                </div>
                                <div class="field">
                                    <label for="year">Year level</label>
                                    <select id="year" name="year" required>
                                        ${optionList(['First Year', 'Second Year', 'Third Year', 'Fourth Year'])}
                                    </select>
                                </div>
                            </div>

                            <div class="schedule-time-grid">
                                <div class="field">
                                    <label for="start">Start time</label>
                                    <div class="time-input-row">
                                        <input id="start" name="start" type="time" min="07:00" max="21:00" required>
                                        <button class="outline set-time-btn" type="button" data-time-input="start">Set</button>
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="end">End time</label>
                                    <div class="time-input-row">
                                        <input id="end" name="end" type="time" min="07:00" max="21:00" required>
                                        <button class="outline set-time-btn" type="button" data-time-input="end">Set</button>
                                    </div>
                                </div>
                            </div>

                            <div class="field" style="margin-top:15px">
                                <label>Teaching days</label>
                                <div class="check-row">
                                    ${DAYS.map(d => `<label><input type="checkbox" name="days" value="${d}">${d}</label>`).join('')}
                                </div>
                            </div>
                                <button class="primary" style="margin-top:20px" type="submit">CONFIRM · Submit for Admin Approval</button>
                        </form>
                    </div>

                            <div class="card" style="margin-top:18px">
                                <h2>My submitted schedules</h2>
                                   <div id="schedule-table" class="schedule-grid"></div>
                            </div>

                </div>`);
                renderScheduleTable(document.querySelector('#schedule-table'), getSession().department, 'ALL', getSession().name);
        }</script>
</body>

</html>
