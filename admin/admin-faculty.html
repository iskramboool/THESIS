<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Faculty | Campus Locate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body data-root="../">
    <div id="app"></div>
    <script src="../js/common.js"></script>
    <script>if (requireRole(['admin'])) { const s = getSession(); const people = [['Dr. Elena Rivera', 'Full-time Instructor', 'P000'], ['Prof. Javier Reyes', 'Program Chairperson', 'P001'], ['Ms. Mia Lim', 'Part-time Instructor', 'P002']]; renderPage('Faculty', 'Department faculty', `<div class="page"><div class="page-heading"><div><p class="eyebrow">Restricted department view</p><h1>Faculty list.</h1><p class="subheading">${s.department}</p></div></div><div class="card"><table class="data-table"><thead><tr><th>Faculty code</th><th>Name</th><th>Title</th><th>Campus status</th></tr></thead><tbody>${people.map(p => `<tr><td>${p[2]}</td><td>${p[0]}</td><td>${p[1]}</td><td><span class="badge present">Present</span></td></tr>`).join('')}</tbody></table></div></div>`) }</script>
</body>

</html>
