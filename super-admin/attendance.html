<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Attendance | Campus Locate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/super-admin.css">
</head>

<body data-root="../">
    <div id="app"></div>
    <script src="../js/common.js"></script>
    <script>if (requireRole(['super_admin'])) { renderPage('Attendance', 'System attendance', `<div class="page"><div class="page-heading"><div><p class="eyebrow">Super Admin · All departments</p><h1>Attendance records.</h1><p class="subheading">QR sessions are validated with faculty code, date, timestamp, and a 12-hour expiry.</p></div></div><div class="card"><table class="data-table"><thead><tr><th>Code</th><th>Faculty</th><th>Department</th><th>Campus status</th><th>QR validity</th></tr></thead><tbody>${[['P000', 'Dr. Elena Rivera', 'Engineering Department', 'In Session'], ['P001', 'Prof. Javier Reyes', 'Engineering Department', 'Present'], ['P013', 'Dr. Carla Navarro', 'Nursing Department', 'Present']].map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="badge ${x[3] === 'Present' ? 'present' : 'active'}">${x[3]}</span></td><td>12 hours max</td></tr>`).join('')}</tbody></table></div></div>`) }</script>
</body>

</html>
